.sm { font: 500 11px/1 var(--sans); fill: #7d8aa3; letter-spacing: .06em; }

#endCard h1 { margin: 0; font: 700 44px/1 var(--serif); }
#endCard .k { margin-top: 10px; font: 600 12px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
#endCard .src { margin-top: 236px; font: 500 11.5px/1.55 var(--sans); color: var(--muted); }
#endCard .by { margin-top: 8px; font: 500 11px/1.4 var(--sans); color: #66728a; }
#replay { position: absolute; left: 50%; top: 556px; transform: translateX(-50%); padding: 10px 20px; border-radius: 999px;
  border: 1.5px solid rgba(238,240,244,.4); background: rgba(8,12,22,.8); color: var(--ink); font: 600 13px/1 var(--sans);
  letter-spacing: .08em; cursor: pointer; -webkit-tap-highlight-color: transparent; }
#replay[hidden] { display: none; }

        <rect x="160" y="288" width="14" height="8" rx="2" fill="#8e98aa"/><rect x="172" y="290" width="16" height="2.4" fill="#8e98aa"/>
        <rect x="64" y="290" width="16" height="6" rx="1.5" fill="#8e98aa"/>
        
      </g></g>
      <!-- Angara cargo -->
      <g transform="translate(-6 156)"><g id="ang">
        <path d="M228 292 L382 292 L374 314 L236 314 Z" fill="#6c5a4c"/>
        <path d="M340 292 V270 H372 V292 Z" fill="#8a7563"/><rect x="346" y="274" width="20" height="4" fill="#c8d4e6" opacity=".5"/>
        <rect x="356" y="258" width="5" height="12" fill="#8a7563"/>
        <g fill="#5a4a3e"><rect x="246" y="282" width="26" height="10"/><rect x="276" y="282" width="26" height="10"/><rect x="306" y="282" width="26" height="10"/></g>
        <path d="M274 282 L274 258 L298 266" stroke="#9a8572" stroke-width="2.4" fill="none"/>
        
      </g>
      </g>
      <g id="smoke"></g>
      <text class="lab" x="118" y="234" text-anchor="middle">MERKURY</text>
      <text class="lab" x="298" y="398" text-anchor="middle">ANGARA</text><text class="sm" x="298" y="380" text-anchor="middle">AT SEA</text>
      <g id="flashes"></g>
      <g id="splash"></g>
      <!-- mother ship -->
      <g id="mom"><path d="M176 556 L256 556 L250 570 L182 570 Z" fill="#3b4660"/><path d="M200 556 V544 H226 V556 Z" fill="#4c5874"/><rect x="214" y="534" width="3" height="10" fill="#4c5874"/>
        <text class="sm" x="216" y="590" text-anchor="middle">MOTHER SHIP</text></g>
      <g id="wakes"></g>
      <g id="drones"></g>
      <g id="dc"><text x="40" y="548" style="font:700 40px var(--serif)" fill="#e9edf5">7</text><text class="ml" x="40" y="566" fill="var(--muted)">NAVAL</text><text class="ml" x="40" y="582" fill="var(--muted)">DRONES</text></g>
      <g id="stampM" transform="translate(118 372)"><g id="stampMi"><rect x="-70" y="-20" width="140" height="40" rx="6" fill="none" stroke="var(--red)" stroke-width="3"/>
        <text x="0" y="8" text-anchor="middle" style="font:700 22px var(--sans); letter-spacing:.12em" fill="var(--red)">CAPSIZED</text></g></g>
      <g id="stampA" transform="translate(306 512)"><g id="stampAi"><rect x="-38" y="-20" width="76" height="40" rx="6" fill="none" stroke="var(--hit)" stroke-width="3"/>
        <text x="0" y="8" text-anchor="middle" style="font:700 22px var(--sans); letter-spacing:.12em" fill="var(--hit)">HIT</text></g></g>
      <g id="heliG" transform="translate(118 448)"><use href="#heli" x="-30" y="-15" width="60" height="30" style="color:#a3acbd"/>
        <path id="heliX" d="M-30 -18 L30 18 M30 -18 L-30 18" stroke="var(--red)" stroke-width="4" stroke-linecap="round"/>
        <text class="ml" x="0" y="36" text-anchor="middle" fill="var(--ink)">KA-27 DESTROYED</text></g>
    </g>

    <!-- Scene 3: tallies (drawn in SVG, text in endCard) -->
    <g id="tally"></g>
  </svg>

  <div id="kicker" class="abs">Nov 22 · Benghazi, Libya</div>
  <div id="title" class="abs">1,500 Miles</div>
  <div id="mi" class="abs"><b id="miN">0</b><small>miles from the front line</small></div>
  <div id="endCard" class="abs">
    <h1>1,500 Miles</h1>
    <div class="k">Ukraine's naval drones, off Libya</div>
    <div class="src">Sources: Zelenskyy and SBU statements (ABC News, Al Jazeera); CBS/AP (distance, ~1,500 mi from the front line); satellite image, Vantor, Nov 22.</div>
    <div class="by">Animated by Claude</div>
  </div>
  <button id="replay" hidden>&#8635; Replay</button>
</div></div>
<script>
(() => {
  const $ = id => document.getElementById(id), NS = "http://www.w3.org/2000/svg", DUR = 19.4;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
  const eout = x => 1 - Math.pow(1 - x, 3);
  const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const op = (el, v) => { el.style.opacity = clamp(v, 0, 1).toFixed(3); };
  const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

  const F = [338.7, 259.9], B = [133.0, 505.2];
  const DL = Math.hypot(B[0] - F[0], B[1] - F[1]);
  $("dist").setAttribute("stroke-dasharray", "6 5");

  // waves
  for (let i = 0; i < 9; i++) { const y = 340 + i * 26; mk("path", { d: `M${(i % 2) * 30 - 30} ${y} q 15 -5 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0`, opacity: (.9 - i * .06).toFixed(2) }, $("waves")); }

  // 7 drones: start at mother ship, end at hull points (illustrative split)
  const targets = [[70, 308], [96, 310], [130, 309], [160, 307], [250, 466], [294, 467], [336, 465]];
  const drones = targets.map((p, i) => {
    const s = [196 + i * 6.5, 552], t0 = 7.3 + i * 0.16, t1 = t0 + 2.0;
    const c = [(s[0] + p[0]) / 2 + (i - 3) * 14, p[1] > 400 ? 536 : 440];
    const wake = mk("path", { stroke: "#cfe2ff", "stroke-width": 1.6, fill: "none", "stroke-linecap": "round", opacity: 0 }, $("wakes"));
    const g = mk("g", {}, $("drones")); mk("use", { href: "#drone", x: -9, y: -4.5, width: 18, height: 9 }, g);
    const fl = mk("circle", { cx: p[0], cy: p[1] - 4, r: 0, fill: "#ffd08a", opacity: 0 }, $("flashes"));
    return { s, p, c, t0, t1, wake, g, fl };
  });
  const bez = (s, c, e, u) => [(1 - u) * (1 - u) * s[0] + 2 * (1 - u) * u * c[0] + u * u * e[0], (1 - u) * (1 - u) * s[1] + 2 * (1 - u) * u * c[1] + u * u * e[1]];
  const smoke = [[120, 290], [150, 286], [284, 444], [320, 440]].map(([x, y], i) => ({ x, y, el: mk("circle", { cx: x, cy: y, r: 0, fill: "#3a3f4c", opacity: 0 }, $("smoke")), i }));
  const ripples = [0, 1, 2].map(i => mk("ellipse", { cx: 118, cy: 314, rx: 0, ry: 0, fill: "none", stroke: "#6d8fc4", "stroke-width": 1.4, opacity: 0 }, $("splash")));

  // tally icons
  const tally = $("tally");
  const rows = [
    { y: 256, n: 7, sym: "drone", w: 28, h: 14, col: "#e9edf5", lab: "DRONES" },
    { y: 322, n: 2, sym: "ship", w: 64, h: 26, col: "var(--hit)", lab: "SHIPS HIT" },
    { y: 388, n: 1, sym: "heli", w: 62, h: 31, col: "var(--red)", lab: "HELICOPTER" }];
  const tIcons = [];
  rows.forEach((r, ri) => {
    mk("text", { x: 26, y: r.y + 8, class: "ml", fill: "var(--muted)" }, tally).textContent = r.lab;
    mk("text", { x: 380, y: r.y + 12, "text-anchor": "end", style: "font:700 34px var(--serif)", fill: "#eef0f4" }, tally).textContent = r.n;
    const gap = ri === 0 ? 4 : 10, x0 = 140;
    for (let i = 0; i < r.n; i++) { const g = mk("g", {}, tally); const u = mk("use", { href: "#" + r.sym, x: x0 + i * (r.w + gap) - 10, y: r.y - r.h / 2, width: r.w, height: r.h }, g); u.style.color = r.col; tIcons.push({ g, d: 15.0 + ri * 0.45 + i * 0.06 }); }
  });
  mk("line", { x1: 26, y1: 428, x2: 380, y2: 428, stroke: "#26324a", "stroke-width": 1 }, tally);

  const E = ["mapS", "mapG", "kicker", "title", "mi", "miN", "dist", "pin", "pinRing", "bLab", "frontPt", "frontRing", "frontLab", "mapLabs", "port", "merk", "ang", "mom", "dc", "stampM", "stampMi", "stampA", "stampAi", "heliG", "heliX", "tally", "endCard"]
    .reduce((o, id) => (o[id] = $(id), o), {});

  function render(t) {
    // Beat 1 (0-6.2): title + map + distance
    op(E.kicker, Math.min(seg(t, 0.1, 0.6), 1 - seg(t, 5.4, 5.9)));
    op(E.title, Math.min(seg(t, 0.2, 0.8), 1 - seg(t, 5.4, 5.9)));
    const z = eio(seg(t, 5.3, 6.4)), sc = 1 + 3 * z;
    E.mapG.setAttribute("transform", `translate(${B[0]} ${B[1]}) scale(${sc.toFixed(3)}) translate(${-B[0]} ${-B[1]})`);
    op(E.mapS, Math.min(seg(t, 0.6, 1.4), 1 - seg(t, 5.8, 6.4)));
    op(E.frontPt, seg(t, 1.4, 1.8)); op(E.frontLab, Math.min(seg(t, 1.5, 1.9), 1 - seg(t, 5.0, 5.3))); op(E.mapLabs, 1 - seg(t, 5.0, 5.3));
    const ph = (t - 1.4) % 1.2 / 1.2; E.frontRing.setAttribute("r", (5 + 10 * Math.max(ph, 0)).toFixed(1)); E.frontRing.style.opacity = t < 1.4 ? 0 : (1 - Math.max(ph, 0)).toFixed(2);
    const dp = eio(seg(t, 2.1, 4.6));
    E.dist.setAttribute("x2", (F[0] + (B[0] - F[0]) * dp).toFixed(1)); E.dist.setAttribute("y2", (F[1] + (B[1] - F[1]) * dp).toFixed(1));
    op(E.dist, t > 2.1 ? 1 : 0);
    op(E.pin, seg(t, 4.5, 4.8)); op(E.bLab, Math.min(seg(t, 4.6, 5.0), 1 - seg(t, 5.25, 5.45)));
    const pr = seg(t, 4.6, 5.6); E.pinRing.setAttribute("r", (6 + 18 * pr).toFixed(1)); E.pinRing.style.opacity = (1 - pr).toFixed(2);
    op(E.mi, Math.min(seg(t, 2.0, 2.4), 1 - seg(t, 5.4, 5.9)));
    const n = Math.round(1500 * eio(seg(t, 2.1, 4.6)) / 10) * 10; E.miN.textContent = (n >= 1500 ? "~" : "") + n.toLocaleString("en-US");

    // Beat 2 (6.0-14.4): port strike
    op(E.port, Math.min(seg(t, 6.0, 6.6), 1 - seg(t, 14.2, 14.7)));
    op(E.mom, seg(t, 6.6, 7.1)); op(E.dc, Math.min(seg(t, 7.3, 7.7), 1));
    drones.forEach(d => {
      const u = eio(seg(t, d.t0, d.t1)), on = t >= d.t0 && t < d.t1 + 0.05;
      const [x, y] = bez(d.s, d.c, d.p, u), [x2, y2] = bez(d.s, d.c, d.p, Math.min(u + .02, 1));
      const ang = Math.atan2(y2 - y, x2 - x) * 180 / Math.PI;
      d.g.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${ang.toFixed(1)})`); d.g.style.opacity = on ? 1 : 0;
      const pts = []; for (let k = 0; k <= 12; k++) { const uu = Math.max(0, u - 0.28 + k * 0.28 / 12); const q = bez(d.s, d.c, d.p, uu); pts.push(q[0].toFixed(1) + "," + q[1].toFixed(1)); }
      d.wake.setAttribute("d", "M" + pts.join("L")); d.wake.style.opacity = (t >= d.t0 ? .55 * (1 - seg(t, d.t1, d.t1 + 1.0)) : 0).toFixed(2);
      const f = seg(t, d.t1, d.t1 + 0.6); d.fl.setAttribute("r", (24 * eout(f)).toFixed(1)); d.fl.style.opacity = (f > 0 && f < 1 ? 1 - f : 0).toFixed(2);
    });
    const hit = seg(t, 9.4, 9.9);
    const burnM = hit * (1 - .5 * seg(t, 11.0, 12.5)), burnA = hit * (1 - .6 * seg(t, 11.0, 12.5));
    E.merk.style.filter = `sepia(${burnM.toFixed(2)}) saturate(${(1 + 3 * burnM).toFixed(2)}) hue-rotate(${(-25 * burnM).toFixed(0)}deg) brightness(${(1 + .25 * burnM).toFixed(2)})`;
    E.ang.style.filter = `sepia(${burnA.toFixed(2)}) saturate(${(1 + 3 * burnA).toFixed(2)}) hue-rotate(${(-25 * burnA).toFixed(0)}deg) brightness(${(1 + .25 * burnA).toFixed(2)})`;
    // Merkury rolls and settles below the waterline
    const s2 = eio(seg(t, 10.3, 12.6));
    E.merk.setAttribute("transform", `translate(${(4 * s2).toFixed(1)} ${(30 * s2).toFixed(1)}) rotate(${(14 * s2).toFixed(1)} 120 314)`);
    ripples.forEach((r, i) => { const q = seg(t, 10.6 + i * 0.5, 12.4 + i * 0.5); r.setAttribute("rx", (40 + 70 * q).toFixed(1)); r.setAttribute("ry", (4 + 7 * q).toFixed(1)); r.style.opacity = (q > 0 && q < 1 ? .7 * (1 - q) : 0).toFixed(2); });
    smoke.forEach(s => { const q = seg(t, 9.7 + s.i * 0.15, 13.8); const tt = t - 9.7;
      s.el.setAttribute("cx", (s.x + 10 * q + 3 * Math.sin(tt * 2 + s.i)).toFixed(1)); s.el.setAttribute("cy", (s.y - 60 * q).toFixed(1));
      s.el.setAttribute("r", (6 + 26 * q).toFixed(1)); s.el.style.opacity = (q > 0 ? .7 * (1 - q * .6) : 0).toFixed(2); });
    const sm = eout(seg(t, 11.8, 12.2)); op(E.stampM, seg(t, 11.8, 12.0)); E.stampMi.setAttribute("transform", `scale(${(1.5 - .5 * sm).toFixed(3)})`);
    const sa = eout(seg(t, 10.2, 10.6)); op(E.stampA, seg(t, 10.2, 10.4)); E.stampAi.setAttribute("transform", `scale(${(1.5 - .5 * sa).toFixed(3)})`);
    op(E.heliG, seg(t, 12.6, 13.0)); E.heliX.style.strokeDasharray = "86 86"; E.heliX.style.strokeDashoffset = (86 * (1 - eout(seg(t, 13.0, 13.5)))).toFixed(1);

    // Beat 3 (14.6-19.4): tallies + sources
    op(E.endCard, seg(t, 14.7, 15.2)); op(E.tally, seg(t, 14.7, 15.0));
    tIcons.forEach(o => { const q = eout(seg(t, o.d, o.d + 0.35)); o.g.style.opacity = q.toFixed(2); o.g.setAttribute("transform", `translate(0 ${(10 * (1 - q)).toFixed(1)})`); });
  }

  const replay = $("replay");
  let raf = 0, t0 = null, playing = false;
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function tick(now) { if (t0 === null) t0 = now; const t = (now - t0) / 1000; render(Math.min(t, DUR));
    if (t < DUR && playing) raf = requestAnimationFrame(tick); else { playing = false; replay.hidden = false; } }
  function play() { cancelAnimationFrame(raf); t0 = null; playing = true; replay.hidden = true; raf = requestAnimationFrame(tick); }
  replay.addEventListener("click", play);
  window.__story = { duration: DUR, seek(t) { playing = false; cancelAnimationFrame(raf); replay.hidden = true; render(clamp(t, 0, DUR)); }, play };

  function fit() { const s = Math.min(innerWidth / 432, innerHeight / 768); $("stage").style.transform = `translate(-50%, -50%) scale(${s})`; }
  addEventListener("resize", fit); fit();
  render(0);
  const start = () => { if (reduce) { render(DUR); replay.hidden = false; } else play(); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
})();
</script>
