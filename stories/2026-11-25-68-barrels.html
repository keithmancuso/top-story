<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>68 Barrels</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=block">
<style>
/* 68 Barrels. Iowa Army Ammunition Plant, Middletown, Iowa. 68 barrels/drums of degraded, crystallized lead azide
   (Army: "more than 9,700 pounds net explosive weight"), stored in earth-covered bunkers, too sensitive to move or treat.
   Controlled in-place detonation set for Wed Nov 25 2026 ~9:00 a.m. CT. Originally Fri Nov 20, moved to Mon Nov 23
   (ahead of a temperature drop), then to Wed (weather, mitigation). Cold/freezing raises the risk (court filings).
   8th Circuit denied environmental groups' emergency motion Mon Nov 23. Relocation recommended within a five-mile
   cone southwest of the plant; shelter-in-place alert up to 20 miles away. Sources: Army.mil, AP via PBS, ABC News, CBS News.
   Fixed 432x768 stage; readable content inside safe box x 26-380 / y 108-600. */
:root {
  --ink: #f1efe6; --muted: #a5a291; --bg: #0d0e0a; --haz: #ffc531; --red: #ff5a3c; --olive: #5b6136; --lead: #8f9499; --ice: #8fd3ff;
  --serif: "Source Serif 4", Georgia, serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --sans: "Inter", "Helvetica Neue", Arial, system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink: #f1efe6; } }
:root[data-theme="dark"] { --ink: #f1efe6; }
html, body { height: 100%; margin: 0; }
body { background: #080906; color: var(--ink); overflow: hidden; -webkit-font-smoothing: antialiased; }
#wrap { position: fixed; inset: 0; overflow: hidden; background: #080906; }
#stage { position: absolute; left: 50%; top: 50%; width: 432px; height: 768px; transform: translate(-50%, -50%); overflow: hidden;
  background: radial-gradient(110% 70% at 50% 40%, #1c1e14 0%, #10110c 55%, #080906 100%); }
.abs { position: absolute; }
#sv { left: 0; top: 0; width: 432px; height: 768px; }
svg text { font-family: var(--sans); }
.k { font: 600 13px var(--sans); letter-spacing: .2em; fill: var(--muted); }
.ttl { font: 700 70px var(--serif); fill: var(--ink); }
.chip { font: 700 19px var(--sans); letter-spacing: .01em; fill: var(--ink); }
.big { font: 700 64px var(--serif); font-variant-numeric: tabular-nums; }
.lbl { font: 700 14px var(--sans); letter-spacing: .06em; }
.calm { font: 700 14px var(--sans); letter-spacing: .2em; fill: #fff; }
.cald { font: 700 62px var(--serif); fill: #15160f; font-variant-numeric: tabular-nums; }
.stamp { font: 800 17px var(--sans); letter-spacing: .14em; fill: var(--red); }
#endCard { left: 26px; top: 140px; width: 354px; text-align: center; opacity: 0; }
#endCard .ic { display: block; margin: 0 auto 10px; }
#endCard h1 { margin: 0; font: 700 58px/1 var(--serif); }
#endCard .row { margin-top: 24px; display: flex; justify-content: center; gap: 14px; }
#endCard .pill { width: 150px; padding: 14px 0 12px; border-radius: 12px; font: 700 32px/1 var(--serif); }
#endCard .pill small { display: block; margin-top: 8px; font: 600 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
#endCard .p1 { border: 2px solid var(--haz); color: var(--haz); }
#endCard .p2 { border: 2px solid var(--red); color: var(--red); }
#endCard .line { margin-top: 22px; font: 600 16px/1.3 var(--sans); letter-spacing: .04em; }
#endCard .src { margin-top: 28px; font: 500 11.5px/1.55 var(--sans); color: var(--muted); }
#endCard .by { margin-top: 8px; font: 500 11px/1.4 var(--sans); color: #77746a; }
#replay { position: absolute; left: 50%; top: 556px; transform: translateX(-50%); padding: 10px 20px; border-radius: 999px;
  border: 1.5px solid rgba(241,239,230,.4); background: rgba(13,14,10,.75); color: var(--ink); font: 600 13px/1 var(--sans);
  letter-spacing: .08em; cursor: pointer; -webkit-tap-highlight-color: transparent; }
#replay[hidden] { display: none; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <svg id="sv" class="abs" viewBox="0 0 432 768">
    <defs>
      <symbol id="barrel" viewBox="0 0 26 32">
        <rect x="1.5" y="1.5" width="23" height="29" rx="4" fill="#5b6136" stroke="#7d8450" stroke-width="1.4"/>
        <path d="M1.5 10 H24.5 M1.5 22 H24.5" stroke="#3b3f22" stroke-width="2"/>
        <ellipse cx="13" cy="3.2" rx="8" ry="1.4" fill="#7d8450"/>
      </symbol>
      <symbol id="glint" viewBox="-10 -10 20 20">
        <path d="M0 -9 L2 -2 L9 0 L2 2 L0 9 L-2 2 L-9 0 L-2 -2 Z" fill="#ffc531"/>
      </symbol>
      <radialGradient id="flash" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#fff4c8"/><stop offset=".45" stop-color="#ffc531" stop-opacity=".7"/><stop offset="1" stop-color="#ffc531" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- Beat 0: title -->
    <g id="g0">
      <text class="k" x="216" y="226" text-anchor="middle">IOWA · TODAY</text>
      <use id="b0" href="#barrel" x="180" y="256" width="72" height="88"/>
      <use id="gl0" href="#glint" x="236" y="252" width="26" height="26"/>
      <text id="ttl" class="ttl" x="216" y="440" text-anchor="middle">68 Barrels</text>
    </g>

    <!-- Beat 1-2: barrel grid -->
    <g id="grid"></g>
    <g id="glints"></g>

    <!-- chips -->
    <g id="chips">
      <g class="cp"><text class="chip" text-anchor="middle" y="0">~9,700 lb lead azide</text></g>
      <g class="cp"><text class="chip" text-anchor="middle" y="0" fill="#ffc531" style="fill:#ffc531">Degraded · shock-sensitive</text></g>
      <g class="cp">
        <g transform="translate(-96 -26)">
          <rect x="0" y="8" width="38" height="20" rx="3" fill="#6d7158"/><rect x="38" y="14" width="16" height="14" rx="2" fill="#8b8f73"/>
          <circle cx="10" cy="30" r="4.5" fill="#cfcab5"/><circle cx="44" cy="30" r="4.5" fill="#cfcab5"/>
          <path d="M-4 0 L58 38" stroke="#ff5a3c" stroke-width="4" stroke-linecap="round"/>
        </g>
        <text class="chip" text-anchor="start" x="-26" y="0">Too risky to move</text>
      </g>
      <g class="cp"><text class="chip" text-anchor="middle" y="0" style="fill:#8fd3ff">Freezing raises the risk</text></g>
    </g>

    <!-- thermometer -->
    <g id="thermo" transform="translate(216 300)">
      <rect x="-14" y="-110" width="28" height="170" rx="14" fill="#1b1d16" stroke="#a5a291" stroke-width="2"/>
      <circle cx="0" cy="74" r="26" fill="#1b1d16" stroke="#a5a291" stroke-width="2"/>
      <rect id="merc" x="-7" y="-80" width="14" height="150" rx="7" fill="#ff5a3c"/>
      <circle id="bulb" cx="0" cy="74" r="19" fill="#ff5a3c"/>
      <path d="M22 -60 H34 M22 -30 H34 M22 0 H34 M22 30 H34" stroke="#a5a291" stroke-width="2"/>
      <g id="flake" transform="translate(84 -40)" stroke="#8fd3ff" stroke-width="4" stroke-linecap="round">
        <path d="M0 -26 V26 M-22.5 -13 L22.5 13 M-22.5 13 L22.5 -13"/>
        <path d="M-7 -20 L0 -13 L7 -20 M-7 20 L0 13 L7 20" fill="none"/>
      </g>
    </g>

    <!-- calendar -->
    <g id="cal" transform="translate(216 296)">
      <g id="calPage">
        <rect x="-78" y="-90" width="156" height="170" rx="12" fill="#f1efe6"/>
        <rect x="-78" y="-90" width="156" height="40" rx="12" fill="#ff5a3c"/>
        <rect x="-78" y="-62" width="156" height="12" fill="#ff5a3c"/>
        <text id="calM" class="calm" x="0" y="-63" text-anchor="middle">FRI · NOV</text>
        <text id="calD" class="cald" x="0" y="34" text-anchor="middle">20</text>
      </g>
      <g id="st1" transform="translate(0 58) rotate(-8)"><rect x="-74" y="-17" width="148" height="34" rx="4" fill="none" stroke="#ff5a3c" stroke-width="3"/><text class="stamp" x="0" y="6" text-anchor="middle">DELAYED</text></g>
      <text id="court" class="chip" x="0" y="130" text-anchor="middle" style="fill:#ffc531">Court: go ahead</text>
      <g id="gavel" transform="translate(78 -90)"><g id="gavelHead"><circle r="26" fill="#ffc531"/><path d="M-12 1 L-3 10 L13 -9" stroke="#15160f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g>
    </g>

    <!-- map -->
    <g id="map">
      <circle id="ring20" cx="216" cy="300" r="150" fill="rgba(143,148,153,.07)" stroke="#8f9499" stroke-width="2" stroke-dasharray="6 6"/>
      <path id="cone" d="" fill="rgba(255,90,60,.38)" stroke="#ff5a3c" stroke-width="2"/>
      <g id="plume"></g>
      <g id="plant" transform="translate(216 300)">
        <circle r="9" fill="#ffc531"/><circle r="15" fill="none" stroke="#ffc531" stroke-width="2"/>
      </g>
      <text class="lbl" x="232" y="292" style="fill:#f1efe6">Plant</text>
      <g id="wind" transform="translate(300 214)">
        <path d="M0 0 L-46 46" stroke="#f1efe6" stroke-width="3" stroke-linecap="round"/>
        <path d="M-46 46 L-44 30 M-46 46 L-30 44" stroke="#f1efe6" stroke-width="3" stroke-linecap="round" fill="none"/>
        <text class="lbl" x="8" y="-4" style="fill:#f1efe6">WIND</text>
      </g>
      <g id="lab5"><text class="lbl" x="30" y="440" style="fill:#ff5a3c">5 MI · RELOCATE</text><text class="lbl" x="30" y="458" style="fill:#ff5a3c;font-size:12px">ADVISED</text></g>
      <g id="lab20"><text class="lbl" x="216" y="482" style="fill:#c7cbcf" text-anchor="middle">UP TO 20 MI · STAY INDOORS</text></g>
    </g>

    <!-- bunker -->
    <g id="bunker">
      <circle id="glow" cx="216" cy="330" r="150" fill="url(#flash)"/>
      <path d="M100 380 Q216 240 332 380 Z" fill="#3e4228" stroke="#6b7046" stroke-width="2"/>
      <rect x="186" y="340" width="60" height="40" rx="3" fill="#2a2c1c" stroke="#6b7046" stroke-width="2"/>
      <g id="tanks">
        <rect x="74" y="342" width="18" height="38" rx="4" fill="#4f7fa3"/><rect x="340" y="342" width="18" height="38" rx="4" fill="#4f7fa3"/>
        <rect x="52" y="348" width="18" height="32" rx="4" fill="#3f6a8a"/><rect x="362" y="348" width="18" height="32" rx="4" fill="#3f6a8a"/>
      </g>
      <g id="mist"></g>
      <path d="M34 380 H376" stroke="#6b7046" stroke-width="2"/>
      <g id="clock" transform="translate(216 180)">
        <circle r="40" fill="#15160f" stroke="#f1efe6" stroke-width="3"/>
        <path d="M0 -32 V-26 M32 0 H26 M0 32 V26 M-32 0 H-26" stroke="#a5a291" stroke-width="2"/>
        <path id="hh" d="M0 0 L0 -20" stroke="#f1efe6" stroke-width="4" stroke-linecap="round"/>
        <path id="mh" d="M0 0 L0 -30" stroke="#ffc531" stroke-width="3" stroke-linecap="round"/>
        <circle r="3.5" fill="#f1efe6"/>
      </g>
      <text id="tLbl" class="big" x="216" y="470" text-anchor="middle" style="fill:#ffc531;font-size:46px">9 AM CT</text>
      <text id="tSub" class="chip" x="216" y="510" text-anchor="middle">Blast in place</text>
    </g>
  </svg>

  <div id="endCard" class="abs">
    <svg class="ic" width="54" height="66" viewBox="0 0 26 32"><use href="#barrel"/></svg>
    <h1>68 Barrels</h1>
    <div class="row">
      <div class="pill p1">~9,700<small>lb lead azide</small></div>
      <div class="pill p2">5 mi<small>relocation advised</small></div>
    </div>
    <div class="line">Set for 9 AM CT today</div>
    <div class="src">Middletown, Iowa · Sources: U.S. Army, AP, PBS NewsHour, ABC News, CBS News</div>
    <div class="by">Animated by Claude</div>
  </div>

  <button id="replay" hidden>&#8635; Replay</button>
</div></div>

<script>
(() => {
  const DUR = 19.5;
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
  const eout = x => 1 - Math.pow(1 - x, 3);
  const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const op = (el, v) => { el.style.opacity = clamp(v, 0, 1).toFixed(3); };
  const E = {};
  ["g0","b0","gl0","ttl","grid","glints","thermo","merc","bulb","flake","cal","calPage","calM","calD","st1","gavel","gavelHead","court",
   "map","ring20","cone","plume","plant","wind","lab5","lab20","bunker","glow","tanks","mist","clock","hh","mh","tLbl","tSub","endCard"].forEach(k => E[k] = $(k));
  const chips = Array.from(document.querySelectorAll("#chips .cp"));

  // 68 barrels: rows of 10,10,10,10,10,10,8
  const cells = [];
  for (let i = 0; i < 68; i++) {
    const r = Math.floor(i / 10), c = i % 10, inRow = r < 6 ? 10 : 8;
    const x = 216 - (inRow * 31 - 5) / 2 + c * 31, y = 150 + r * 37;
    const u = document.createElementNS(NS, "use");
    u.setAttribute("href", "#barrel"); u.setAttribute("x", x); u.setAttribute("y", y); u.setAttribute("width", 26); u.setAttribute("height", 32);
    E.grid.appendChild(u); cells.push({ el: u, x, y, d: ((i * 37) % 68) / 68 });
  }
  // glints on 14 barrels
  const glints = [];
  for (let k = 0; k < 14; k++) {
    const c = cells[(k * 29 + 5) % 68];
    const g = document.createElementNS(NS, "use");
    g.setAttribute("href", "#glint"); g.setAttribute("width", 16); g.setAttribute("height", 16);
    g.setAttribute("x", c.x + 15); g.setAttribute("y", c.y - 4);
    E.glints.appendChild(g); glints.push({ el: g, ph: k * 0.37 });
  }
  // cone: 5 mi from plant toward SW (scale: 20 mi = 150 px, so 5 mi = 37.5 px; drawn to scale)
  (() => {
    const R = 37.5 * 1.0, cx = 216, cy = 300, a0 = (135 - 30) * Math.PI / 180, a1 = (135 + 30) * Math.PI / 180;
    const p = a => `${(cx + R * Math.cos(a)).toFixed(1)} ${(cy + R * Math.sin(a)).toFixed(1)}`;
    E.cone.setAttribute("d", `M${cx} ${cy} L${p(a0)} A${R} ${R} 0 0 1 ${p(a1)} Z`);
  })();
  // leader line for 5 mi label
  const lead = document.createElementNS(NS, "path");
  lead.setAttribute("d", "M194 322 L110 426"); lead.setAttribute("stroke", "#ff5a3c"); lead.setAttribute("stroke-width", "1.5");
  E.lab5.appendChild(lead);
  // plume dots drifting SW
  const dots = [];
  for (let k = 0; k < 16; k++) {
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("r", 2 + (k % 3)); c.setAttribute("fill", "#8f9499");
    E.plume.appendChild(c); dots.push({ el: c, ph: (k * 0.61) % 1, sp: ((k * 7) % 11 - 5) * 0.06 });
  }
  // mist droplets
  const drops = [];
  for (let k = 0; k < 18; k++) {
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("r", 2); c.setAttribute("fill", "#8fd3ff");
    E.mist.appendChild(c); drops.push({ el: c, side: k % 2, ph: (k * 0.43) % 1, h: (k * 13) % 7 });
  }

  function render(t) {
    // Beat 0 (0-2.6): title
    op(E.g0, Math.min(seg(t, 0.1, 0.6), 1 - seg(t, 2.3, 2.7)));
    E.b0.setAttribute("y", (276 - 20 * eout(seg(t, 0.2, 1.0))).toFixed(1));
    op(E.gl0, seg(t, 1.0, 1.3) * (0.6 + 0.4 * Math.sin(t * 9)));
    op(E.ttl, seg(t, 0.7, 1.3));

    // Grid (2.7-6.3): barrels pop in, then glint
    const gridOut = 1 - seg(t, 6.1, 6.5);
    cells.forEach(c => {
      const f = eout(seg(t, 2.7 + c.d * 1.0, 2.95 + c.d * 1.0));
      op(c.el, Math.min(f, gridOut));
      c.el.setAttribute("y", (c.y + 10 * (1 - f)).toFixed(1));
    });
    const gl = seg(t, 3.9, 4.2) * gridOut;
    glints.forEach(g => {
      const tw = 0.5 + 0.5 * Math.sin(t * 7 + g.ph * 6);
      op(g.el, gl * tw);
    });

    // Chips (one at a time) at y 470
    const win = [[3.0, 4.0], [4.1, 5.1], [5.2, 6.4], [6.7, 8.5]];
    chips.forEach((g, i) => {
      const [a, b] = win[i]; const f = eout(seg(t, a, a + 0.3));
      op(g, Math.min(f, 1 - seg(t, b - 0.2, b)));
      g.setAttribute("transform", `translate(216 ${(i === 3 ? 520 : 470) + 8 * (1 - f)})`);
    });

    // Thermometer (6.5-8.5): mercury falls, snowflake appears
    op(E.thermo, Math.min(seg(t, 6.5, 6.8), 1 - seg(t, 8.3, 8.6)));
    const fall = eio(seg(t, 6.8, 7.9));
    const top = -80 + 110 * fall;
    E.merc.setAttribute("y", top.toFixed(1)); E.merc.setAttribute("height", (150 - 110 * fall).toFixed(1));
    const col = fall > 0.55 ? "#8fd3ff" : "#ff5a3c";
    E.merc.setAttribute("fill", col); E.bulb.setAttribute("fill", col);
    op(E.flake, seg(t, 7.4, 7.8));
    E.flake.setAttribute("transform", `translate(84 -40) rotate(${(60 * seg(t, 7.4, 8.6)).toFixed(1)})`);

    // Calendar (8.6-11.4): FRI 20 -> MON 23 -> WED 25, gavel
    op(E.cal, Math.min(seg(t, 8.6, 8.9), 1 - seg(t, 11.2, 11.5)));
    let m = "FRI · NOV", d = "20";
    if (t >= 9.5) { m = "MON · NOV"; d = "23"; }
    if (t >= 10.2) { m = "WED · NOV"; d = "25"; }
    E.calM.textContent = m; E.calD.textContent = d;
    let flip = 0;
    [9.5, 10.2].forEach(b => { const dd = t - b + 0.11; if (dd >= 0 && dd < 0.22) flip = Math.max(flip, Math.sin(Math.PI * dd / 0.22)); });
    E.calPage.setAttribute("transform", `scale(1 ${(1 - 0.75 * flip).toFixed(3)})`);
    // DELAYED stamp shows on Fri and Mon pages just before each flip
    const s1 = Math.max(seg(t, 9.0, 9.1) * (1 - seg(t, 9.35, 9.45)), seg(t, 9.75, 9.85) * (1 - seg(t, 10.05, 10.15)));
    op(E.st1, s1);
    // Gavel swings down on Wed
    const gv = seg(t, 10.4, 10.65);
    op(E.gavel, seg(t, 10.3, 10.45));
    E.gavelHead.setAttribute("transform", `scale(${(0.4 + 0.6 * eout(gv) + 0.15 * Math.sin(Math.PI * gv)).toFixed(3)})`);
    op(E.court, seg(t, 10.6, 10.9));

    // Map (11.4-15.4)
    op(E.map, Math.min(seg(t, 11.4, 11.8), 1 - seg(t, 15.2, 15.5)));
    const rg = eout(seg(t, 11.6, 12.6));
    E.ring20.setAttribute("r", (150 * rg).toFixed(1));
    op(E.ring20, rg);
    op(E.wind, seg(t, 12.2, 12.6));
    op(E.cone, seg(t, 12.8, 13.2));
    op(E.lab5, seg(t, 13.0, 13.4));
    op(E.lab20, seg(t, 12.4, 12.8));
    const pf = seg(t, 13.2, 13.6) * (1 - seg(t, 15.0, 15.4));
    dots.forEach(p => {
      const u = ((t - 13.2) * 0.35 + p.ph) % 1;
      const dist = 12 + 120 * (u < 0 ? 0 : u);
      const ang = (135 + p.sp * 40) * Math.PI / 180;
      p.el.setAttribute("cx", (216 + dist * Math.cos(ang)).toFixed(1));
      p.el.setAttribute("cy", (300 + dist * Math.sin(ang)).toFixed(1));
      op(p.el, pf * 0.5 * (1 - u));
    });

    // Bunker + clock (15.5-17.6)
    op(E.bunker, Math.min(seg(t, 15.5, 15.8), 1 - seg(t, 17.4, 17.7)));
    const ck = eio(seg(t, 15.7, 16.7));
    const mAng = -180 + 180 * ck;          // minute hand sweeps from :30 to :00
    const hAng = 255 + 15 * ck;            // hour hand eases to 9
    E.mh.setAttribute("transform", `rotate(${mAng.toFixed(1)})`);
    E.hh.setAttribute("transform", `rotate(${hAng.toFixed(1)})`);
    op(E.tLbl, seg(t, 16.3, 16.6)); op(E.tSub, seg(t, 16.6, 16.9));
    op(E.glow, 0.55 * seg(t, 16.7, 17.0) * (0.75 + 0.25 * Math.sin(t * 6)));
    drops.forEach(dp => {
      const u = ((t - 15.5) * 0.9 + dp.ph) % 1;
      const x0 = dp.side ? 348 : 84, dir = dp.side ? -1 : 1;
      dp.el.setAttribute("cx", (x0 + dir * 70 * u).toFixed(1));
      dp.el.setAttribute("cy", (338 - 40 * Math.sin(Math.PI * u) - dp.h).toFixed(1));
      op(dp.el, seg(t, 15.6, 15.9) * (1 - u));
    });

    // End card (17.7-19.5)
    op(E.endCard, seg(t, 17.7, 18.1));
  }

  const replay = $("replay");
  let raf = 0, t0 = null, playing = false;
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function tick(now) { if (t0 === null) t0 = now; const t = (now - t0) / 1000; render(Math.min(t, DUR));
    if (t < DUR && playing) raf = requestAnimationFrame(tick); else { playing = false; replay.hidden = false; } }
  function play() { cancelAnimationFrame(raf); t0 = null; playing = true; replay.hidden = true; raf = requestAnimationFrame(tick); }
  replay.addEventListener("click", play);
  window.__story = { duration: DUR, seek(t) { playing = false; cancelAnimationFrame(raf); replay.hidden = true; render(clamp(t, 0, DUR)); }, play };

  function fit() { const s = Math.min(innerWidth / 432, innerHeight / 768); $("stage").style.transform = `translate(-50%, -50%) scale(${s})`; }
  addEventListener("resize", fit); fit();
  render(0);
  const start = () => { if (reduce) { render(DUR); replay.hidden = false; } else play(); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
})();
</script>
